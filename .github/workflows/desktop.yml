name: Native video frame diagnostics
on:
  push:
    branches: [codex/native-video-diagnostics]
permissions:
  contents: read
jobs:
  frames:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:video
        env:
          BITCRUSH_TEST_INSTALL_FFMPEG: '1'
          BITCRUSH_TEST_FFMPEG_CACHE: test-results/native-ffmpeg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-frame-diagnostics
          path: |
            test-results/*.json
            test-results/*.png
            test-results/*.mp4
          retention-days: 7
