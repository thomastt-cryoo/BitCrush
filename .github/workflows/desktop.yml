name: Electron Studio builds and workflow tests

on:
  push:
    branches: [main, codex/electron-redesign]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codec-source:
    name: Offline codec corresponding sources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/package-codec-sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-core-0.12.10-sources
          path: |
            artifacts/ffmpeg-core-0.12.10-sources.zip
            artifacts/ffmpeg-core-0.12.10-sources.json
          retention-days: 14

  electron:
    name: Studio ${{ matrix.name }}
    needs: codec-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-2025
            packaged: artifacts/BitCrush-Windows-Electron/BitCrush.exe
          - name: Mac-Intel
            runner: macos-15-intel
            packaged: artifacts/BitCrush-Mac-Intel-Electron/BitCrush.app/Contents/MacOS/Electron
          - name: Mac-Apple-Silicon
            runner: macos-15
            packaged: artifacts/BitCrush-Mac-Apple-Silicon-Electron/BitCrush.app/Contents/MacOS/Electron
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Original engines and Studio workflows in Electron
        run: npm test
      - name: Studio design states and settings controls
        run: npm run test:design
      - name: Source colors and palette round trips
        run: npm run test:colors
      - name: Package full Electron runtime
        run: npm run package:zip
      - name: Verify copied application runtime and resources
        run: npm test
        env:
          BITCRUSH_PACKAGED_EXECUTABLE: ${{ github.workspace }}/${{ matrix.packaged }}
      - name: Verify source colors in copied application
        run: npm run test:colors
        env:
          BITCRUSH_PACKAGED_EXECUTABLE: ${{ github.workspace }}/${{ matrix.packaged }}
      - name: Verify macOS signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict artifacts/BitCrush-${{ matrix.name }}-Electron/BitCrush.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BitCrush-${{ matrix.name }}-Electron
          path: |
            artifacts/*.zip
            artifacts/*.json
            test-results/*.json
            test-results/*.png
          retention-days: 14
